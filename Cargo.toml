[workspace]
resolver = "2"
members = [
  "contracts/vault-registry",
  "contracts/access-lease",
  "contracts/subscription",
  "contracts/common",
]

[workspace.package]
edition = "2021"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/SynapsVault/contracts"

[workspace.metadata.build]
# Consumed by .github/workflows/ci.yml to emit the build manifest
# (commit, toolchain, SDK, and CLI versions) alongside the WASM files.
sdk = "soroban-sdk 29.0.0"
cli = "stellar-cli"

[workspace.dependencies]
soroban-sdk = { version = "29.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
