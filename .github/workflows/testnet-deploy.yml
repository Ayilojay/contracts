name: Testnet Deploy

on:
  workflow_dispatch:
    inputs:
      resume:
        description: "Resume from the latest deploy-checkpoints-testnet artifact"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETWORK: testnet
      CONTRACT_IDS_FILE: deployed/contract-ids.env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Verify network configuration
        run: |
          set -euo pipefail
          echo "Deploying to network: ${NETWORK}"
          stellar network ls | grep -qx "${NETWORK}" || {
            echo "::error::Network '${NETWORK}' is not configured in stellar-cli"
            exit 1
          }

      - name: Restore deploy checkpoints (resume)
        if: ${{ inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: deploy-checkpoints-${{ env.NETWORK }}
          path: deployed/checkpoints

      - name: Build contracts
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Deploy and init contracts
        run: |
          set -euo pipefail
          mkdir -p deployed/checkpoints
          # Deploy/init each contract, writing checkpoint lines and readback
          # verification results as described in deployed/contract-ids.env.
          ./scripts/deploy.sh "${NETWORK}" "${CONTRACT_IDS_FILE}"

      - name: Validate deployment manifest
        run: |
          set -euo pipefail
          file="${CONTRACT_IDS_FILE}"
          if [ ! -f "$file" ]; then
            echo "::error::Manifest file '$file' does not exist"
            exit 1
          fi

          # Load key=value pairs (ignore comments and blank lines).
          declare -A manifest=()
          while IFS='=' read -r key value; do
            case "$key" in
              ''|'#'*) continue ;;
            esac
            manifest["$key"]="$value"
          done < "$file"

          fail=0
          require() {
            local key="$1"
            if [ -z "${manifest[$key]:-}" ]; then
              echo "::error::Manifest missing required field '$key'"
              fail=1
            fi
          }

          # Required contract IDs and versions.
          for contract in vault_registry access_lease subscription; do
            require "$contract"
            require "${contract}_version"
          done
          require network
          require deployed_at

          # Format validation for contract IDs (Stellar contract ID: C + 55 base32 chars).
          for contract in vault_registry access_lease subscription; do
            id="${manifest[$contract]:-}"
            if [ -n "$id" ] && ! [[ "$id" =~ ^C[A-Z2-7]{55}$ ]]; then
              echo "::error::Contract ID for '$contract' is malformed: '$id'"
              fail=1
            fi
          done

          # Format validation for versions (semver MAJOR.MINOR.PATCH).
          for contract in vault_registry access_lease subscription; do
            ver="${manifest[${contract}_version]:-}"
            if [ -n "$ver" ] && ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version for '$contract' is malformed: '$ver'"
              fail=1
            fi
          done

          # Network must match the workflow's target network.
          net="${manifest[network]:-}"
          if [ -n "$net" ] && [ "$net" != "${NETWORK}" ]; then
            echo "::error::Manifest network '$net' does not match expected '${NETWORK}'"
            fail=1
          fi

          # Timestamp must be ISO-8601 UTC.
          ts="${manifest[deployed_at]:-}"
          if [ -n "$ts" ] && ! [[ "$ts" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::deployed_at is not an ISO-8601 UTC timestamp: '$ts'"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Deployment manifest validation failed; refusing to commit"
            exit 1
          fi
          echo "Deployment manifest validated successfully"

      - name: Upload deploy checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-checkpoints-${{ env.NETWORK }}
          path: deployed/checkpoints
          if-no-files-found: ignore

      - name: Commit contract IDs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${CONTRACT_IDS_FILE}"
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: update ${NETWORK} contract IDs"
          git push
