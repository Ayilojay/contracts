name: Testnet Deploy

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Stellar network to deploy to"
        required: true
        default: testnet
        type: choice
        options:
          - testnet
          - futurenet
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/testnet-deploy.yml"

concurrency:
  group: testnet-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "27.0.0"
  # Bounded retry policy for friendbot funding calls.
  FRIENDBOT_MAX_ATTEMPTS: "5"
  FRIENDBOT_BASE_DELAY_SECONDS: "3"

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.network || 'testnet' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.network || 'testnet' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable + wasm32v1-none
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          curl -sL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin
          stellar --version

      - name: Build all contracts
        run: stellar contract build --locked

      - name: Resolve network settings
        id: net
        run: |
          NETWORK="${{ github.event.inputs.network || 'testnet' }}"
          case "$NETWORK" in
            testnet)
              RPC_URL="https://soroban-testnet.stellar.org"
              NETWORK_PASSPHRASE="Test SDF Network ; September 2015"
              FRIENDBOT_URL="https://friendbot.stellar.org"
              ;;
            futurenet)
              RPC_URL="https://rpc-futurenet.stellar.org"
              NETWORK_PASSPHRASE="Test SDF Future Network ; October 2022"
              FRIENDBOT_URL="https://friendbot-futurenet.stellar.org"
              ;;
            *)
              echo "::error::Unsupported network: $NETWORK"
              exit 1
              ;;
          esac
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          echo "rpc_url=$RPC_URL" >> "$GITHUB_OUTPUT"
          echo "network_passphrase=$NETWORK_PASSPHRASE" >> "$GITHUB_OUTPUT"
          echo "friendbot_url=$FRIENDBOT_URL" >> "$GITHUB_OUTPUT"

      - name: Fund and verify deployer account (required)
        id: fund-deployer
        env:
          FRIENDBOT_URL: ${{ steps.net.outputs.friendbot_url }}
          RPC_URL: ${{ steps.net.outputs.rpc_url }}
          NETWORK_PASSPHRASE: ${{ steps.net.outputs.network_passphrase }}
        run: |
          set -euo pipefail

          # Generate a fresh deployer identity.
          stellar keys generate deployer --network "${{ steps.net.outputs.network }}" --fund false
          DEPLOYER_ADDR=$(stellar keys address deployer)
          echo "deployer=$DEPLOYER_ADDR" >> "$GITHUB_OUTPUT"

          account_exists() {
            stellar account show "$DEPLOYER_ADDR" \
              --rpc-url "$RPC_URL" \
              --network-passphrase "$NETWORK_PASSPHRASE" >/dev/null 2>&1
          }

          # Bounded retry with exponential backoff for transient friendbot failures.
          attempt=1
          while [ "$attempt" -le "$FRIENDBOT_MAX_ATTEMPTS" ]; do
            echo "Friendbot funding attempt $attempt/$FRIENDBOT_MAX_ATTEMPTS for $DEPLOYER_ADDR"
            if curl -fsS --max-time 30 "${FRIENDBOT_URL}/?addr=${DEPLOYER_ADDR}" >/dev/null; then
              echo "Friendbot accepted funding request on attempt $attempt"
            else
              echo "::warning::Friendbot request failed on attempt $attempt"
            fi

            # Verify the account actually exists on-chain before proceeding.
            if account_exists; then
              echo "Deployer account $DEPLOYER_ADDR is funded and ready"
              exit 0
            fi

            if [ "$attempt" -lt "$FRIENDBOT_MAX_ATTEMPTS" ]; then
              delay=$(( FRIENDBOT_BASE_DELAY_SECONDS * attempt ))
              echo "Account not ready yet; retrying in ${delay}s"
              sleep "$delay"
            fi
            attempt=$(( attempt + 1 ))
          done

          echo "::error::Required deployer account $DEPLOYER_ADDR was not established after $FRIENDBOT_MAX_ATTEMPTS attempts"
          exit 1

      - name: Fund optional accounts (best-effort)
        id: fund-optional
        continue-on-error: true
        env:
          FRIENDBOT_URL: ${{ steps.net.outputs.friendbot_url }}
          RPC_URL: ${{ steps.net.outputs.rpc_url }}
          NETWORK_PASSPHRASE: ${{ steps.net.outputs.network_passphrase }}
        run: |
          set -uo pipefail

          # Optional accounts are surfaced but never block deployment.
          OPTIONAL_ACCOUNTS="${OPTIONAL_ACCOUNTS:-}"
          if [ -z "$OPTIONAL_ACCOUNTS" ]; then
            echo "No optional accounts configured; skipping"
            exit 0
          fi

          failed=""
          for addr in $OPTIONAL_ACCOUNTS; do
            funded=0
            attempt=1
            while [ "$attempt" -le "$FRIENDBOT_MAX_ATTEMPTS" ]; do
              if curl -fsS --max-time 30 "${FRIENDBOT_URL}/?addr=${addr}" >/dev/null; then
                if stellar account show "$addr" \
                  --rpc-url "$RPC_URL" \
                  --network-passphrase "$NETWORK_PASSPHRASE" >/dev/null 2>&1; then
                  funded=1
                  break
                fi
              fi
              if [ "$attempt" -lt "$FRIENDBOT_MAX_ATTEMPTS" ]; then
                sleep $(( FRIENDBOT_BASE_DELAY_SECONDS * attempt ))
              fi
              attempt=$(( attempt + 1 ))
            done
            if [ "$funded" -eq 1 ]; then
              echo "Optional account $addr funded"
            else
              echo "::warning::Optional account $addr could not be funded after $FRIENDBOT_MAX_ATTEMPTS attempts"
              failed="$failed $addr"
            fi
          done

          if [ -n "$failed" ]; then
            echo "::warning::Optional accounts not funded:$failed"
            echo "optional_failures=$failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Report funding summary
        if: always()
        run: |
          {
            echo "## Testnet deploy funding summary"
            echo ""
            echo "- Network: ${{ steps.net.outputs.network }}"
            echo "- Deployer: ${{ steps.fund-deployer.outputs.deployer }}"
            echo "- Required deployer funding: ${{ steps.fund-deployer.outcome }}"
            echo "- Optional accounts funding: ${{ steps.fund-optional.outcome }}"
            if [ -n "${{ steps.fund-optional.outputs.optional_failures }}" ]; then
              echo "- Optional failures:${{ steps.fund-optional.outputs.optional_failures }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy contracts
        env:
          RPC_URL: ${{ steps.net.outputs.rpc_url }}
          NETWORK_PASSPHRASE: ${{ steps.net.outputs.network_passphrase }}
        run: |
          set -euo pipefail
          for wasm in target/wasm32v1-none/release/*.wasm; do
            echo "Deploying $(basename "$wasm")"
            stellar contract deploy \
              --wasm "$wasm" \
              --source deployer \
              --rpc-url "$RPC_URL" \
              --network-passphrase "$NETWORK_PASSPHRASE"
          done
