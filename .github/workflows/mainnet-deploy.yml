name: Mainnet Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-mainnet" to confirm mainnet deployment'
        required: true
        type: string
      resume_run_id:
        description: 'Optional: run ID of a previous mainnet deploy to resume (reuses its checkpoint artifact)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  confirm:
    name: Confirmation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy-mainnet" ]; then
            echo "::error::Confirmation failed. You must type 'deploy-mainnet' to proceed."
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with mainnet deployment."

  deploy:
    name: Deploy Contracts to Mainnet
    needs: confirm
    runs-on: ubuntu-latest
    environment: mainnet
    timeout-minutes: 30
    env:
      NETWORK: mainnet
      RPC_URL: https://soroban-mainnet.stellar.org
      NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
      DEPLOYER_SECRET: ${{ secrets.MAINNET_DEPLOYER_SECRET }}
      ADMIN_PUBLIC: ${{ secrets.MAINNET_ADMIN_PUBLIC }}
      RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check secrets
        run: |
          for v in DEPLOYER_SECRET ADMIN_PUBLIC; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not configured for the mainnet environment"
              exit 1
            fi
          done

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install Stellar CLI v27
        run: |
          curl -sL \
            https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar xz -C /usr/local/bin
          stellar --version

      - name: Test contracts
        run: cargo test --locked --workspace

      - name: Build contracts
        run: |
          stellar contract build --locked
          ls -lh target/wasm32v1-none/release/*.wasm

      - name: Configure network
        run: |
          set -euo pipefail
          if stellar network add "$NETWORK" \
              --rpc-url "$RPC_URL" \
              --network-passphrase "$NETWORK_PASSPHRASE" 2>/dev/null; then
            echo "Network '$NETWORK' configured."
          elif stellar network ls 2>/dev/null | grep -qx "$NETWORK"; then
            echo "Network '$NETWORK' already configured; verifying settings."
            CONFIG=$(stellar network settings "$NETWORK" 2>/dev/null || true)
            if [ -z "$CONFIG" ]; then
              echo "::error::Unable to read settings for existing network '$NETWORK'."
              exit 1
            fi
            ACTUAL_RPC=$(printf '%s\n' "$CONFIG" | grep -i 'rpc' | head -n1 | sed -E 's/.*: *//' | tr -d '"')
            ACTUAL_PASS=$(printf '%s\n' "$CONFIG" | grep -i 'passphrase' | head -n1 | sed -E 's/.*: *//' | tr -d '"')
            if [ "$ACTUAL_RPC" != "$RPC_URL" ]; then
              echo "::error::Network '$NETWORK' RPC URL mismatch: expected '$RPC_URL', got '$ACTUAL_RPC'."
              exit 1
            fi
            if [ "$ACTUAL_PASS" != "$NETWORK_PASSPHRASE" ]; then
              echo "::error::Network '$NETWORK' passphrase mismatch: expected '$NETWORK_PASSPHRASE', got '$ACTUAL_PASS'."
              exit 1
            fi
            echo "Existing network '$NETWORK' settings verified."
          else
            echo "::error::Failed to configure network '$NETWORK'."
            exit 1
          fi

      - name: Restore checkpoint (resume)
        if: ${{ github.event.inputs.resume_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deployed/checkpoints
          gh run download "$RESUME_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name mainnet-deploy-checkpoint \
            --dir deployed/checkpoints
          echo "Restored checkpoint from run $RESUME_RUN_ID:"
          cat deployed/checkpoints/*.env 2>/dev/null || true

      - name: Deploy + init contracts
        run: |
          set -euo pipefail
          mkdir -p deployed/checkpoints
          for PKG in vault_registry access_lease subscription; do
            VAR=$(echo "$PKG" | tr '[:lower:]' '[:upper:]')
            CHECKPOINT="deployed/checkpoints/${PKG}.env"
            if [ -f "$CHECKPOINT" ]; then
              # shellcheck disable=SC1090
              . "$CHECKPOINT"
              if [ -n "${CONTRACT_ID:-}" ]; then
                echo "::notice::Resuming ${PKG}; reusing existing ID ${CONTRACT_ID}"
                echo "${VAR}=${CONTRACT_ID}" >> "$GITHUB_ENV"
                continue
              fi
            fi
            ID=$(stellar contract deploy \
              --wasm "target/wasm32v1-none/release/${PKG}.wasm" \
              --source-account "$DEPLOYER_SECRET" \
              --network "$NETWORK")
            echo "::notice::${PKG}=${ID}"
            {
              echo "CONTRACT_ID=${ID}"
              echo "PACKAGE=${PKG}"
              echo "DEPLOY_STATUS=deployed"
              echo "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$CHECKPOINT"
            stellar contract invoke \
              --id "$ID" \
              --source-account "$DEPLOYER_SECRET" \
              --network "$NETWORK" \
              -- init --admin "$ADMIN_PUBLIC"
            # Post-init readback: verify on-chain admin and stored version match intent.
            EXPECTED_VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg pkg "$(echo "$PKG" | tr '_' '-')" '.packages[] | select(.name == $pkg) | .version')
            ACTUAL_ADMIN=$(stellar contract invoke \
              --id "$ID" \
              --source-account "$DEPLOYER_SECRET" \
              --network "$NETWORK" \
              -- admin 2>/dev/null | tr -d '"' | tr -d '[:space:]')
            ACTUAL_VERSION=$(stellar contract invoke \
              --id "$ID" \
              --source-account "$DEPLOYER_SECRET" \
              --network "$NETWORK" \
              -- version 2>/dev/null | tr -d '"' | tr -d '[:space:]')
            if [ "$ACTUAL_ADMIN" != "$ADMIN_PUBLIC" ]; then
              echo "::error::${PKG} admin readback mismatch: expected '$ADMIN_PUBLIC', got '$ACTUAL_ADMIN'."
              exit 1
            fi
            if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "::error::${PKG} version readback mismatch: expected '$EXPECTED_VERSION', got '$ACTUAL_VERSION'."
              exit 1
            fi
            echo "::notice::${PKG} readback verified (admin=${ACTUAL_ADMIN}, version=${ACTUAL_VERSION})"
            echo "INIT_STATUS=initialized" >> "$CHECKPOINT"
            echo "INIT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$CHECKPOINT"
            echo "${VAR}=${ID}" >> "$GITHUB_ENV"
          done

      - name: Upload checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-deploy-checkpoint
          path: deployed/checkpoints/
          if-no-files-found: warn
          retention-days: 90

      - name: Write contract IDs
        run: |
          VERSION_OF() {
            cargo metadata --no-deps --format-version 1 \
              | jq -r --arg pkg "$1" '.packages[] | select(.name == $pkg) | .version'
          }
          mkdir -p deployed
          {
            echo "vault_registry=$VAULT_REGISTRY"
            echo "vault_registry_version=$(VERSION_OF vault-registry)"
            echo "access_lease=$ACCESS_LEASE"
            echo "access_lease_version=$(VERSION_OF access-lease)"
            echo "subscription=$SUBSCRIPTION"
            echo "subscription_version=$(VERSION_OF subscription)"
            echo "network=$NETWORK"
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > deployed/mainnet-contract-ids.env
          cat deployed/mainnet-contract-ids.env

      - name: Commit contract IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployed/mainnet-contract-ids.env
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update mainnet contract IDs [skip ci]"
            git push
          fi
