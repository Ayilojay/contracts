name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly dependency audit so advisories are caught between pushes.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-events:
    name: Event table sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check contract event payloads match docs/CONTRACTS.md
        run: python3 scripts/check_events.py

  check-errors:
    name: Error table sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Error enums match docs/CONTRACTS.md
        run: python3 scripts/check_errors.py

  audit:
    name: Dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit workspace lockfile
        run: cargo audit --file Cargo.lock

  lint:
    name: Format + Clippy + Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build docs (rustdoc)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Test vault-registry
        run: cargo test --locked --package vault-registry

      - name: Test access-lease
        run: cargo test --locked --package access-lease

      - name: Test subscription
        run: cargo test --locked --package subscription

      - name: Gas / footprint report (vault-registry)
        run: cargo test --locked --package vault-registry gas -- --nocapture

  test-workspace:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Lease encoding size
        run: cargo test --locked --package access-lease encoding_size -- --nocapture

      - name: Subscription encoding size
        run: cargo test --locked --package subscription encoding_size -- --nocapture
      - name: Test workspace
        run: cargo test --locked --workspace

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [lint, test, test-workspace]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable + wasm32v1-none
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      # Single maintained source of the Stellar CLI version, shared with the
      # deploy workflows via the reusable install action.
      - name: Install Stellar CLI
        uses: ./.github/actions/install-stellar-cli

      # soroban-sdk >= 25 refuses plain `cargo build` for wasm; the CLI
      # builds and post-processes (spec shaking) the contracts.
      - name: Build all contracts
        run: stellar contract build --locked

      - name: Report WASM sizes
        run: |
          echo "| Contract | Size (bytes) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in target/wasm32v1-none/release/*.wasm; do
            size=$(stat -c%s "$f")
            echo "$(basename "$f"): $size bytes"
            echo "| $(basename "$f") | $size |" >> "$GITHUB_STEP_SUMMARY"
            # Soroban rejects contracts over 64 KiB.
            if [ "$size" -gt 65536 ]; then
              echo "::error::$(basename "$f") exceeds the 64 KiB Soroban limit"
              exit 1
            fi
          done

      - name: Generate SHA-256 checksum manifest
        run: |
          cd target/wasm32v1-none/release
          # sha256sum emits `<hash>  <filename>` lines, one per binary.
          sha256sum *.wasm > SHA256SUMS
          echo "Generated checksum manifest:"
          cat SHA256SUMS
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SHA-256 checksums" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate build manifest
        run: |
          cd target/wasm32v1-none/release
          # Capture toolchain and source metadata so artifacts are reproducible.
          rustc_version=$(rustc --version)
          cargo_version=$(cargo --version)
          stellar_version=$(stellar --version | head -n1)
          sdk_version=$(grep -m1 '^name = "soroban-sdk"' -A1 Cargo.lock 2>/dev/null | sed -n 's/^version = "\(.*\)"/\1/p' || true)
          if [ -z "$sdk_version" ]; then
            sdk_version=$(grep -m1 'soroban-sdk' ../../../../Cargo.lock -A1 2>/dev/null | sed -n 's/^version = "\(.*\)"/\1/p' || true)
          fi
          cat > build-manifest.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "repository": "${GITHUB_REPOSITORY}",
            "run_id": "${GITHUB_RUN_ID}",
            "rustc": "${rustc_version}",
            "cargo": "${cargo_version}",
            "stellar_cli": "${stellar_version}",
            "soroban_sdk": "${sdk_version}",
            "target": "wasm32v1-none"
          }
          EOF
          echo "Generated build manifest:"
          cat build-manifest.json
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build-manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-contracts
          path: |
            target/wasm32v1-none/release/*.wasm
            target/wasm32v1-none/release/SHA256SUMS
            target/wasm32v1-none/release/build-manifest.json
          retention-days: 14
